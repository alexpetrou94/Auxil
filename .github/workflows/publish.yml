name: Build, Test, and Publish

on:
  push:
    branches: [production]
    tags: ['v*']
  pull_request:
    branches: [production]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Auxil.sln

      - name: Build
        run: dotnet build Auxil.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Auxil.sln --configuration Release --no-build --verbosity normal

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Auxil.sln

      - name: Build
        run: dotnet build Auxil.sln --configuration Release --no-restore

      - name: Read version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: dotnet pack Auxil/Auxil.csproj --configuration Release --no-build --output ./packages /p:Version=${{ steps.version.outputs.version }}

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/alexpetrou94/index.json" \
            --name github \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text
          dotnet nuget push ./packages/*.nupkg --source github --skip-duplicate
